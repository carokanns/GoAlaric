[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goalaric-optimizer"
version = "1.2.2"
description = "Restartable, SQLite-backed GoAlaric optimizer core"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
bayes = [
  "botorch==0.18.1",
]

[project.scripts]
optimizer = "goalaric_optimizer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
